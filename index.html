<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PE Decision Tool – AHA 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ─── TOKENS ─────────────────────────────────────────── */
    :root {
      --bg:        #1e2837;
      --surface:   #161b22;
      --surface2:  #1e2530;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #7d8590;
      --accent:    #58a6ff;
      --safe:      #3fb950;
      --warn:      #d29922;
      --danger:    #f85149;
      --radius:    14px;
      --radius-sm: 8px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
      --font-sans: 'DM Sans', sans-serif;
      --font-serif:'DM Serif Display', serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-weight: 400;
      line-height: 1.6; min-height: 100svh;
      display: flex; flex-direction: column;
    }

    /* ─── HEADER ─────────────────────────────────────────── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #1f6feb, #58a6ff);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px;
    }
    .logo-text { font-family: var(--font-serif); font-size: 1.05rem; }
    .logo-sub  { font-size: .7rem; color: var(--muted); margin-top: -2px; }
    .btn-sm {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); padding: 6px 12px; border-radius: var(--radius-sm);
      font-family: var(--font-sans); font-size: .78rem; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .btn-sm:hover { color: var(--text); border-color: var(--accent); }

    /* ─── PROGRESS ───────────────────────────────────────── */
    #progress-wrap { background: var(--surface2); height: 3px; }
    #progress-bar  { height: 3px; background: var(--accent); transition: width .4s ease; width: 0%; }

    /* ─── MAIN ───────────────────────────────────────────── */
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }

    /* ─── BREADCRUMB ─────────────────────────────────────── */
    #breadcrumb {
      display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center;
      font-size: .72rem; color: var(--muted); margin-bottom: 20px;
      width: 100%; max-width: 640px;
    }
    .crumb { cursor: pointer; transition: color .15s; }
    .crumb:hover { color: var(--accent); }
    .crumb-sep { opacity: .4; }

    /* ─── CARD ───────────────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px 24px;
      width: 100%; max-width: 640px; box-shadow: var(--shadow);
      animation: cardIn .3s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── COR BADGE ──────────────────────────────────────── */
    .cor-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px; font-size: .68rem;
      font-weight: 600; letter-spacing: .04em; margin-bottom: 12px; border: 1px solid;
    }

    /* ─── CARD TYPOGRAPHY ────────────────────────────────── */
    .card-icon     { font-size: 2rem; margin-bottom: 10px; display: block; }
    .card-title    { font-family: var(--font-serif); font-size: 1.5rem; line-height: 1.2; margin-bottom: 4px; }
    .card-subtitle { font-size: .82rem; color: var(--muted); margin-bottom: 14px; }
    .card-body     { font-size: .92rem; color: #b1bac4; white-space: pre-line; margin-bottom: 20px; line-height: 1.7; }

    /* ─── HINT BOX ───────────────────────────────────────── */
    .hint-box {
      background: rgba(88,166,255,.07); border: 1px solid rgba(88,166,255,.18);
      border-radius: var(--radius-sm); padding: 10px 13px;
      font-size: .78rem; color: #9ec5fb; margin-bottom: 20px; line-height: 1.5;
    }
    .hint-box::before { content: "ℹ  "; font-weight: 700; }

    /* ─── BUTTONS ────────────────────────────────────────── */
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: var(--accent); color: #0d1117;
      border: none; border-radius: var(--radius-sm); padding: 14px 20px;
      font-family: var(--font-sans); font-weight: 600; font-size: .95rem;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .btn-primary:hover  { opacity: .9; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 20px;
      font-family: var(--font-sans); font-weight: 500; font-size: .92rem;
      cursor: pointer; transition: border-color .15s;
    }
    .btn-secondary:hover { border-color: var(--accent); }

    /* ─── OPTION BUTTONS ─────────────────────────────────── */
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .option-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px; text-align: left;
      cursor: pointer; transition: border-color .15s, background .15s;
      color: var(--text); font-family: var(--font-sans);
    }
    .option-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.06); }
    .option-label { font-size: .92rem; font-weight: 500; }
    .option-desc  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    /* ─── SCORE CHECKLIST ────────────────────────────────── */
    .score-description {
      background: rgba(88,166,255,.06); border: 1px solid rgba(88,166,255,.15);
      border-radius: var(--radius-sm); padding: 10px 13px;
      font-size: .82rem; color: #9ec5fb; margin-bottom: 16px; white-space: pre-line;
    }
    .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .check-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: border-color .15s, background .15s; user-select: none;
    }
    .check-item:hover  { border-color: #4d9fd6; background: rgba(88,166,255,.04); }
    .check-item.checked { border-color: var(--accent); background: rgba(88,166,255,.08); }
    .check-box {
      flex-shrink: 0; width: 20px; height: 20px; border: 2px solid var(--border);
      border-radius: 5px; margin-top: 1px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; transition: background .15s, border-color .15s;
    }
    .check-item.checked .check-box { background: var(--accent); border-color: var(--accent); color: #0d1117; }
    .check-label { font-size: .88rem; flex: 1; }
    .check-pts {
      font-size: .78rem; font-weight: 600; color: var(--accent); flex-shrink: 0;
      background: rgba(88,166,255,.1); padding: 2px 7px; border-radius: 4px;
    }

    /* ─── SCORE TOTAL ────────────────────────────────────── */
    .score-total {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px;
    }
    .score-total-label { font-size: .88rem; color: var(--muted); }
    .score-total-value { font-size: 1.8rem; font-family: var(--font-serif); color: var(--accent); }

    /* ─── D-DIMER / AGE INPUT ────────────────────────────── */
    .ddimer-group   { margin-bottom: 16px; }
    .ddimer-label   { font-size: .82rem; color: var(--muted); margin-bottom: 6px; display: block; }
    .ddimer-row     { display: flex; gap: 10px; align-items: center; }
    .ddimer-input, .age-input {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans);
      font-size: 1.05rem; padding: 10px 14px; outline: none; transition: border-color .15s;
    }
    .ddimer-input { flex: 1; }
    .age-input    { width: 100px; }
    .ddimer-input:focus, .age-input:focus { border-color: var(--accent); }
    .ddimer-unit  { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .ddimer-hint  { font-size: .74rem; color: #9ec5fb; margin-top: 6px; }
    .age-row      { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .age-threshold {
      font-size: .78rem; color: var(--warn); background: rgba(210,153,34,.08);
      border: 1px solid rgba(210,153,34,.2); border-radius: 6px; padding: 5px 10px;
    }

    /* ─── INTERPRETATION TABS ────────────────────────────── */
    .interp-tabs  { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .interp-tab {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; font-size: .78rem; cursor: pointer; color: var(--muted); transition: .15s;
    }
    .interp-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.07); }

    /* ─── RESULT CARD BORDERS ────────────────────────────── */
    .result-safe    { border-color: var(--safe); }
    .result-warning { border-color: var(--warn); }
    .result-danger  { border-color: var(--danger); }

    /* ─── BANNERS ────────────────────────────────────────── */
    .result-banner {
      padding: 12px 16px; border-radius: var(--radius-sm); font-size: .85rem;
      font-weight: 500; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
    }
    .banner-safe    { background: rgba(63,185,80,.12);  color: var(--safe);   border: 1px solid rgba(63,185,80,.25); }
    .banner-warning { background: rgba(210,153,34,.12); color: var(--warn);   border: 1px solid rgba(210,153,34,.25); }
    .banner-danger  { background: rgba(248,81,73,.12);  color: var(--danger); border: 1px solid rgba(248,81,73,.25); }

    /* ─── NOTE & DISCLAIMER ──────────────────────────────── */
    .note-box {
      background: rgba(210,153,34,.07); border: 1px solid rgba(210,153,34,.2);
      border-radius: var(--radius-sm); padding: 10px 13px;
      font-size: .8rem; color: #d29922; margin-top: 14px;
    }
    .note-box::before { content: "⚠  "; }
    .disclaimer {
      margin-top: 20px; font-size: .72rem; color: var(--muted);
      background: rgba(255,255,255,.03); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 13px; line-height: 1.5;
    }

    /* ─── CTPA CHECK ─────────────────────────────────────── */
    .ci-section-label {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; margin: 18px 0 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .ci-section-label.abs { color: var(--danger); }
    .ci-section-label.rel { color: var(--warn); }
    .ci-section-label.none { color: var(--safe); }

    .ci-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; margin-bottom: 7px;
      transition: border-color .15s, background .15s; user-select: none;
    }
    .ci-item:hover { background: rgba(255,255,255,.03); }
    .ci-item.ci-abs { border-color: var(--danger); background: rgba(248,81,73,.07); }
    .ci-item.ci-rel { border-color: var(--warn);   background: rgba(210,153,34,.07); }
    .ci-item.ci-none-checked { border-color: var(--safe); background: rgba(63,185,80,.08); }
    .ci-box {
      flex-shrink: 0; width: 20px; height: 20px; border: 2px solid var(--border);
      border-radius: 5px; margin-top: 1px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; transition: background .15s, border-color .15s;
    }
    .ci-item.ci-abs .ci-box { background: var(--danger); border-color: var(--danger); color: #fff; }
    .ci-item.ci-rel .ci-box { background: var(--warn);   border-color: var(--warn);   color: #fff; }
    .ci-item.ci-none-checked .ci-box { background: var(--safe); border-color: var(--safe); color: #fff; }

    /* CTPA OK banner */
    .ctpa-ok {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3);
      border-radius: var(--radius-sm); color: var(--safe);
      font-size: .9rem; font-weight: 600; margin: 16px 0;
    }

    /* Alternative cards */
    .alt-section-label {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin: 20px 0 8px;
    }
    .alt-card {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 13px 15px; margin-bottom: 9px; background: var(--surface2);
    }
    .alt-card.best { border-color: var(--accent); background: rgba(88,166,255,.07); }
    .alt-card.selected { border-color: var(--safe); background: rgba(63,185,80,.09); box-shadow: 0 0 0 1px var(--safe); }
    .alt-card.selected.best { border-color: var(--safe); }
    .alt-header {
      display: flex; align-items: center; gap: 8px;
      font-size: .92rem; font-weight: 600; margin-bottom: 5px;
    }
    .alt-best-badge {
      margin-left: auto; font-size: .67rem; background: rgba(88,166,255,.15);
      color: var(--accent); border: 1px solid rgba(88,166,255,.25);
      border-radius: 10px; padding: 2px 8px; white-space: nowrap;
    }
    .alt-desc { font-size: .8rem; color: var(--muted); line-height: 1.5; }
    .alt-card[onclick] { transition: border-color .15s, background .15s; }
    .alt-card[onclick]:hover { border-color: var(--accent); background: rgba(88,166,255,.07); }
    .alt-cta { margin-top: 10px; font-size: .8rem; font-weight: 600; color: var(--accent); }
    .alt-cta-selected { color: var(--safe); }
    .alt-subitems { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .alt-subitem {
      font-size: .77rem; color: #9ec5fb;
      display: flex; align-items: flex-start; gap: 6px;
    }
    .alt-subitem::before { content: "→"; flex-shrink: 0; opacity: .6; }

    /* Echo table (inside alt-card) */
    .echo-toggle {
      display: flex; align-items: center; gap: 6px; font-size: .8rem;
      color: var(--accent); cursor: pointer; background: none; border: none;
      font-family: var(--font-sans); padding: 0; margin-top: 10px;
    }
    .echo-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: .76rem; min-width: 380px; }
    th, td { padding: 8px 11px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--surface2); color: var(--muted); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* ─── PATIENT BADGE / REPORT BUTTON ──────────────────── */
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    #patient-badge { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #report-btn.report-ready, #report-btn-schematic.report-ready { color: var(--safe); border-color: rgba(63,185,80,.4); }

    /* ─── PATIENT GATE ───────────────────────────────────── */
    .patient-id-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans);
      font-size: 1rem; padding: 12px 14px; outline: none; transition: border-color .15s;
      margin-bottom: 16px;
    }
    .patient-id-input:focus { border-color: var(--accent); }

    .ctpa-comment-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans);
      font-size: .92rem; padding: 10px 12px; outline: none; resize: vertical; min-height: 64px;
      transition: border-color .15s;
    }
    .ctpa-comment-input:focus { border-color: var(--accent); }

    /* ─── FOOTER ─────────────────────────────────────────── */
    footer { text-align: center; padding: 16px; font-size: .7rem; color: var(--muted); border-top: 1px solid var(--border); }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      .card-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🫁</div>
    <div>
      <div class="logo-text">PE Decision Tool</div>
      <div class="logo-sub">AHA Guidelines 2026 - ESC Guideline 2019</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-sm" id="patient-badge" onclick="editPatientId()" title="Imposta/modifica l'ID paziente (resta solo in questo browser)">🪪 Anonimo</button>
    <button class="btn-sm" id="report-btn" onclick="downloadReport('visual')" title="Scarica il report PDF (versione visiva) del percorso svolto finora">📄 Report</button>
    <button class="btn-sm" id="report-btn-schematic" onclick="downloadReport('schematic')" title="Scarica il report PDF (versione schematica) del percorso svolto finora">📋 Schema</button>
    <button class="btn-sm" onclick="resetApp()">↺ Riavvia</button>
  </div>
</header>

<div id="progress-wrap"><div id="progress-bar"></div></div>

<main>
  <div id="breadcrumb"></div>
  <div id="content"></div>
</main>

<footer>
  Strumento di supporto decisionale – Non sostituisce il giudizio clinico del medico.<br>
  Fonte: AHA 2026 Adults With Acute Pulmonary Embolism © 2026 American Heart Association
</footer>

<script src="decision_tree.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let history  = [];
let scores   = {};   // { nodeId: { items:{id:bool}, total:num, interpIdx:num } }
let ddimers  = {};   // { nodeId: { value:num, age:num } }
let ctpaState= {};   // { ci_id: bool }
let ctpaComments = {}; // { nodeId: "commento libero del medico" }
let ctpaChoice   = {}; // { nodeId: altId } — modalità di imaging scelta esplicitamente dall'utente

// ── Identificativo paziente & log delle scelte (per il report) ──
// L'ID paziente vive SOLO in questa variabile di sessione: non viene mai
// salvato, inviato o persistito da nessuna parte. Serve unicamente ad
// etichettare il report PDF scaricato dal medico. Lo strumento resta
// anonimo lato software.
let patientId   = "";
let decisionLog = [];  // [{ fromIndex, fromNodeId, fromTitle, toNodeId, choice, detail, ts }]

const TOTAL_STEPS = 7;

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
function goTo(nodeId) {
  if (!PE_DECISION_TREE[nodeId]) { console.error("Node not found:", nodeId); return; }
  // Registra nel log la scelta che ha portato dal nodo corrente a quello nuovo,
  // derivandola automaticamente dal contenuto del nodo di partenza (nessun dato
  // aggiuntivo richiesto): garantisce che il report rifletta esattamente il
  // percorso e le selezioni fatte in app, senza aggiungere altro.
  const fromId = history[history.length - 1];
  if (fromId) {
    const { choice, detail } = describeTransition(fromId, nodeId);
    decisionLog.push({
      fromIndex: history.length,
      fromNodeId: fromId,
      fromTitle: PE_DECISION_TREE[fromId].title || fromId,
      toNodeId: nodeId,
      choice, detail,
      ts: new Date().toISOString()
    });
  }
  // Reset ctpa state each time we enter a ctpa_check-type node
  if (PE_DECISION_TREE[nodeId].type === "ctpa_check") { ctpaState = {}; ctpaComments[nodeId] = ""; ctpaChoice[nodeId] = null; }
  history.push(nodeId);
  render(nodeId);
  updateReportButtonState();
}

function goBack() {
  if (history.length <= 1) return;
  history.pop();
  decisionLog = decisionLog.filter(e => e.fromIndex < history.length);
  render(history[history.length - 1]);
  updateReportButtonState();
}

function resetApp() {
  history = []; scores = {}; ddimers = {}; ctpaState = {}; ctpaComments = {}; ctpaChoice = {}; decisionLog = [];
  // Ogni nuova valutazione riparte "pulita": l'ID paziente della valutazione
  // precedente non deve essere riportato per errore su un altro paziente.
  patientId = "";
  updatePatientBadge();
  renderPatientGate();
  updateReportButtonState();
}

function jumpTo(idx) {
  history = history.slice(0, idx + 1);
  decisionLog = decisionLog.filter(e => e.fromIndex < history.length);
  const lastId = history[history.length - 1];
  if (PE_DECISION_TREE[lastId]?.type === "ctpa_check") { ctpaState = {}; ctpaComments[lastId] = ""; ctpaChoice[lastId] = null; }
  render(lastId);
  updateReportButtonState();
}

/* ═══════════════════════════════════════════════════════════════
   PATIENT ID – schermata iniziale + badge header
   Nessun dato viene trasmesso o salvato: la variabile `patientId`
   vive solo in memoria del browser per la durata della sessione ed
   è usata esclusivamente per etichettare il report PDF.
   ═══════════════════════════════════════════════════════════════ */
function renderPatientGate() {
  document.getElementById("breadcrumb").innerHTML = "";
  document.getElementById("progress-bar").style.width = "0%";
  const el = document.getElementById("content");
  el.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <span class="card-icon">🪪</span>
    <h1 class="card-title">Identificativo Paziente</h1>
    <p class="card-subtitle">Facoltativo — usato solo per etichettare il report</p>
    <div class="hint-box">L'ID inserito resta esclusivamente in questo browser, per la durata della sessione, al solo scopo di etichettare il report scaricabile a fine valutazione. Non viene salvato, trasmesso o collegato a nessun dato clinico: lo strumento resta anonimo lato software.</div>
    <label class="ddimer-label" for="patient-id-input">Codice / ID paziente (es. numero cartella, iniziali)</label>
    <input class="patient-id-input" id="patient-id-input" type="text" maxlength="64"
      placeholder="es. RX-0234 — oppure lascia vuoto" value="${escapeHtml(patientId)}"
      onkeydown="if(event.key==='Enter'){confirmPatientId();}" />
    <button class="btn-primary" onclick="confirmPatientId()">Continua →</button>
    <button class="btn-secondary" style="margin-top:10px" onclick="skipPatientId()">Salta — resta anonimo</button>
  `;
  el.appendChild(card);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function confirmPatientId() {
  const inp = document.getElementById("patient-id-input");
  patientId = inp ? inp.value.trim() : "";
  updatePatientBadge();
  history = []; // la schermata paziente non fa parte dell'albero decisionale
  goTo("start");
}

function skipPatientId() {
  patientId = "";
  updatePatientBadge();
  history = [];
  goTo("start");
}

function editPatientId() {
  const v = prompt("Inserisci/modifica l'ID paziente (facoltativo — resta solo in questo browser, non viene salvato né trasmesso):", patientId || "");
  if (v === null) return; // annullato
  patientId = v.trim();
  updatePatientBadge();
}

function updatePatientBadge() {
  const b = document.getElementById("patient-badge");
  if (!b) return;
  b.textContent = patientId ? ("🪪 " + patientId) : "🪪 Anonimo";
}

function updateReportButtonState() {
  const ready = decisionLog.length > 0;
  const btn1 = document.getElementById("report-btn");
  const btn2 = document.getElementById("report-btn-schematic");
  if (btn1) btn1.classList.toggle("report-ready", ready);
  if (btn2) btn2.classList.toggle("report-ready", ready);
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ═══════════════════════════════════════════════════════════════
   DECISION LOG – ricostruzione automatica delle scelte
   ═══════════════════════════════════════════════════════════════ */
function ctpaSelectionSummary(node) {
  const noneId = node.no_contraindications_option.id;
  if (ctpaState[noneId]) return "Nessuna controindicazione presente.";
  const abs = (node.contraindications.absolute || []).filter(ci => ctpaState[ci.id]).map(ci => "[Assoluta] " + ci.label);
  const rel = (node.contraindications.relative || []).filter(ci => ctpaState[ci.id]).map(ci => "[Relativa] " + ci.label);
  const all = [...abs, ...rel];
  return all.length ? ("Controindicazioni selezionate: " + all.join("; ")) : "";
}

/* Determina la modalità di imaging scelta dall'utente sul nodo ctpa_check
   corrente — condivisa tra interfaccia, log delle decisioni e generazione
   del report. Richiede una selezione ESPLICITA (click dell'utente su una
   delle card proposte): il solo aver spuntato le controindicazioni non
   basta a considerare la scelta "fatta". */
function getCtpaRecommendation(node) {
  const noneId = node.no_contraindications_option.id;
  const checkedIds = Object.keys(ctpaState).filter(k => ctpaState[k] && k !== noneId);
  const noneChecked = !!ctpaState[noneId];
  const hasAny = checkedIds.length > 0;
  if (!noneChecked && !hasAny) return { made: false, pending: false };

  const chosenId = ctpaChoice[node.id];
  if (!chosenId) return { made: false, pending: true };

  const recommended = node.alternatives.find(a => a.id === chosenId) || null;
  return {
    made: true,
    recommended,
    selectionSummary: ctpaSelectionSummary(node),
    comment: (ctpaComments[node.id] || "").trim()
  };
}

function describeTransition(fromId, toId) {
  const node = PE_DECISION_TREE[fromId];
  if (!node) return { choice: "Continua", detail: "" };

  if (node.type === "question") {
    const opt = (node.options || []).find(o => o.next === toId);
    return { choice: opt ? ("Selezione: " + opt.label) : "Continua", detail: opt && opt.desc ? opt.desc : "" };
  }

  if (node.type === "ctpa_check") {
    const alt = (node.alternatives || []).find(a => a.next === toId);
    return {
      choice: alt ? ("Modalità di imaging scelta: " + alt.label) : "Continua",
      detail: ctpaSelectionSummary(node)
    };
  }

  if (node.type === "score") {
    const nid = fromId;
    const state = scores[nid] || { items:{}, total:0, interpIdx:0 };
    const result = getScoreResult(node, state, nid);
    const lines = [];
    if (node.interpretation && node.interpretation.length > 1) {
      lines.push("Schema interpretativo utilizzato: " + node.interpretation[state.interpIdx].label);
    }
    if (node.scoreType === "years") {
      const dd = ddimers[nid] || {};
      if (node.items && node.items.length) {
        const checked = node.items.filter(it => state.items[it.id]).map(it => it.label);
        lines.push("Criteri soddisfatti: " + (checked.length ? checked.join("; ") : "nessuno"));
      }
      lines.push("Età paziente: " + (dd.age ? dd.age + " anni" : "n.d."));
      lines.push("D-Dimero misurato: " + (dd.value !== undefined ? dd.value + " ng/mL" : "n.d."));
    } else {
      const checked = node.items.filter(it => state.items[it.id]).map(it => it.label);
      lines.push("Criteri selezionati: " + (checked.length ? checked.join("; ") : "nessuno"));
      lines.push("Punteggio totale: " + state.total);
    }
    // L'headline riprende direttamente la categoria/esito calcolato dalla regola
    // (già scritta in linguaggio clinico chiaro) invece di ripetere il titolo
    // dello step: rende ogni riga "Risultato:" immediatamente informativa.
    return { choice: "Risultato: " + (result ? result.category : "punteggio calcolato"), detail: lines.join("\n") };
  }

  // info / result: transizione semplice, nessuna scelta multipla da registrare
  return { choice: "Continua", detail: "" };
}

/* Stato/esito del nodo attualmente visualizzato, per la sezione "Esito" del report */
function getCurrentOutcomeSummary() {
  const curId = history[history.length - 1];
  const node = PE_DECISION_TREE[curId];
  if (!node) return null;

  if (node.type === "result" && !node.next) {
    return {
      status: "finale", title: node.title, subtitle: node.subtitle || "",
      body: node.body || "", note: node.note || "", severity: node.severity || "warning"
    };
  }

  if (node.type === "ctpa_check") {
    const rec = getCtpaRecommendation(node);
    if (rec.made) {
      return {
        status: "finale", title: node.title,
        subtitle: rec.selectionSummary,
        body: rec.recommended
          ? ("Modalità di imaging scelta: " + rec.recommended.label + " — " + rec.recommended.desc)
          : "Nessuna modalità determinata dalle controindicazioni selezionate.",
        note: "", comment: rec.comment, severity: "warning",
        bannerOverride: "Modalità di imaging selezionata: " + (rec.recommended ? rec.recommended.label : "Non determinata")
      };
    }
    return {
      status: "in corso", title: node.title, subtitle: node.subtitle || "",
      body: "Percorso non ancora concluso a questo step.", note: "", severity: "warning"
    };
  }

  return {
    status: "in corso", title: node.title, subtitle: node.subtitle || "",
    body: "Percorso non ancora concluso a questo step.", note: "", severity: "warning"
  };
}

/* ═══════════════════════════════════════════════════════════════
   REPORT PDF
   Genera un PDF con: identificativo paziente (se inserito), data/ora,
   l'elenco cronologico di tutte le scelte fatte nel percorso, e
   l'esito corrente — senza aggiungere interpretazioni cliniche
   ulteriori rispetto a quanto già determinato dallo strumento.
   ═══════════════════════════════════════════════════════════════ */
function sanitizeForPdf(s) {
  if (!s) return "";
  return String(s)
    .replace(/≥/g, ">=").replace(/≤/g, "<=")
    .replace(/→/g, "->").replace(/±/g, "+/-")
    .replace(/[–—]/g, "-").replace(/•/g, "-")
    .replace(/[\u{1F300}-\u{1FAFF}]|[\u2600-\u27BF]|[\u2190-\u21FF]|[\u2B00-\u2BFF]/gu, "")
    .replace(/\s+$/gm, "");
}

/* Raccoglie i dati del report — condivisi tra la variante visiva e quella
   schematica, così che le due restino sempre coerenti tra loro. */
function collectReportData() {
  const now = new Date();
  const dateStr = now.toLocaleDateString("it-IT") + " " + now.toLocaleTimeString("it-IT");
  const rawGuidelineChoice = (decisionLog.find(e => e.fromNodeId === "choose_guideline") || {}).choice || "";
  const guidelineChoice = rawGuidelineChoice.replace(/^Selezione:\s*/, "") || "Non determinato";
  const outcome = getCurrentOutcomeSummary();

  // Se il percorso termina con una scelta di modalità di imaging già fatta
  // dall'utente, aggiungila come step finale del percorso decisionale
  // (copia locale: non modifica il log reale dell'app).
  const stepsForReport = decisionLog.slice();
  const curNode = PE_DECISION_TREE[history[history.length - 1]];
  if (curNode && curNode.type === "ctpa_check") {
    const rec = getCtpaRecommendation(curNode);
    if (rec.made) {
      // La modalità scelta è già l'headline dello step (campo "choice"): nei
      // dettagli riportiamo solo le informazioni di supporto, senza ripeterla.
      const lines = [rec.selectionSummary];
      if (rec.comment) lines.push("Commento: " + rec.comment);
      stepsForReport.push({
        fromTitle: curNode.title,
        choice: rec.recommended ? ("Modalità di imaging scelta: " + rec.recommended.label) : "Modalità di imaging selezionata",
        detail: lines.filter(Boolean).join("\n")
      });
    }
  }

  const sevKey = s => (s === "safe" ? "safe" : s === "danger" ? "danger" : "warn");
  let bannerKey = "warn", bannerLabel = "Valutazione in corso";
  if (outcome) {
    if (outcome.status === "finale") {
      bannerKey = sevKey(outcome.severity);
      bannerLabel = outcome.bannerOverride || ("ESITO: " + outcome.title + (outcome.subtitle ? " — " + outcome.subtitle : ""));
    } else {
      bannerKey = "warn";
      bannerLabel = "VALUTAZIONE IN CORSO — step corrente: " + outcome.title;
    }
  }

  return { now, dateStr, guidelineChoice, outcome, stepsForReport, bannerKey, bannerLabel, sevKey };
}

/* Punto di ingresso unico per il download del report, nelle due varianti
   disponibili: "visual" (impaginazione curata, colori, card) oppure
   "schematic" (solo testo, essenziale, senza fronzoli grafici). */
function downloadReport(style) {
  if (!decisionLog.length) {
    alert("Nessuno step registrato: completa almeno un passaggio della valutazione prima di scaricare il report.");
    return;
  }
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("Libreria di generazione PDF non disponibile (verifica la connessione a internet) e riprova.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const data = collectReportData();

  if (style === "schematic") renderSchematicPdf(doc, data);
  else renderVisualPdf(doc, data);

  const idPart = patientId ? patientId.replace(/[^a-zA-Z0-9_-]/g, "_") : "anonimo";
  const stamp  = data.now.toISOString().slice(0, 19).replace(/[:T]/g, "-");
  const suffix = style === "schematic" ? "schema" : "visivo";
  doc.save(`PE-Report_${idPart}_${suffix}_${stamp}.pdf`);
}

/* ═══════════════════════════════════════════════════════════════
   REPORT — VARIANTE VISIVA (banner colorato, card, box)
   ═══════════════════════════════════════════════════════════════ */
function renderVisualPdf(doc, data) {
  const { dateStr, guidelineChoice, outcome, stepsForReport, bannerKey, bannerLabel, sevKey } = data;
  const marginX = 46;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxW  = pageW - marginX * 2;
  let y = 58;

  // ── Palette coerente con i colori dell'interfaccia ──
  const COL = {
    dark:     [22, 27, 34],
    text:     [45, 51, 59],
    muted:    [122, 130, 140],
    faint:    [244, 246, 248],
    border:   [219, 223, 228],
    accent:   [31, 111, 235],
    safe:     [30, 132, 73],   safeBg:   [223, 244, 227],
    warn:     [163, 111, 8],   warnBg:   [252, 237, 201],
    danger:   [200, 40, 40],   dangerBg: [253, 224, 222]
  };

  function drawRunningHeader() {
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...COL.muted);
    doc.text("PE Decision Tool — Report di Valutazione" + (patientId ? "   ·   ID: " + sanitizeForPdf(patientId) : ""), marginX, 30);
    doc.setDrawColor(...COL.border); doc.setLineWidth(0.6);
    doc.line(marginX, 36, pageW - marginX, 36);
    doc.setLineWidth(0.5);
  }
  function ensureSpace(h) {
    if (y + h > pageH - 58) { doc.addPage(); y = 56; drawRunningHeader(); }
  }
  function wrapLines(text, width) { return doc.splitTextToSize(sanitizeForPdf(text), width); }

  function sectionHeading(text) {
    ensureSpace(28);
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...COL.dark);
    doc.text(sanitizeForPdf(text), marginX, y);
    y += 6;
    doc.setDrawColor(...COL.accent); doc.setLineWidth(1.4);
    doc.line(marginX, y, marginX + 32, y);
    doc.setLineWidth(0.5); doc.setDrawColor(...COL.border);
    y += 16;
  }

  // Banner sintetico dell'esito (verde/arancio/rosso) subito sotto il titolo
  function statusBanner(label, key) {
    const lines = wrapLines(label, maxW - 24);
    const h = lines.length * 13 + 16;
    ensureSpace(h + 12);
    doc.setFillColor(...COL[key + "Bg"]);
    doc.roundedRect(marginX, y, maxW, h, 5, 5, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...COL[key]);
    let ty = y + 19;
    lines.forEach(l => { doc.text(l, marginX + 14, ty); ty += 13; });
    doc.setTextColor(...COL.dark);
    y += h + 16;
  }

  // Riquadro info paziente/sessione a due colonne
  function infoBox(pairs) {
    const lineH = 15;
    const h = pairs.length * lineH + 16;
    ensureSpace(h + 12);
    doc.setDrawColor(...COL.border); doc.setFillColor(...COL.faint);
    doc.roundedRect(marginX, y, maxW, h, 5, 5, "FD");
    let ty = y + 19;
    pairs.forEach(([label, value]) => {
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...COL.muted);
      doc.text(sanitizeForPdf(label), marginX + 14, ty);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...COL.text);
      doc.text(sanitizeForPdf(String(value)), marginX + 140, ty);
      ty += lineH;
    });
    doc.setTextColor(...COL.dark);
    y += h + 18;
  }

  // Card numerata per ogni step del percorso decisionale.
  // Gli step puramente di passaggio (choice === "Continua") mostrano solo
  // il titolo, senza riga "Scelta:" — non rappresentano una vera decisione.
  function stepCard(idx, e) {
    const titleLines  = wrapLines(e.fromTitle, maxW - 60);
    const showChoice  = e.choice && e.choice !== "Continua";
    const choiceLines = showChoice ? wrapLines(e.choice, maxW - 60) : [];
    const detailLines = e.detail
      ? e.detail.split("\n").filter(Boolean).flatMap(l => wrapLines("–  " + l, maxW - 72))
      : [];
    const h = 16 + titleLines.length * 13 + choiceLines.length * 12 + (detailLines.length ? 4 : 0) + detailLines.length * 11 + 10;
    ensureSpace(h + 10);

    doc.setDrawColor(...COL.border); doc.setFillColor(252, 252, 253);
    doc.roundedRect(marginX, y, maxW, h, 4, 4, "FD");

    doc.setFillColor(...COL.accent);
    doc.circle(marginX + 17, y + 17, 9.5, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(255, 255, 255);
    doc.text(String(idx), marginX + 17, y + 20, { align: "center" });

    let ty = y + 14;
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...COL.dark);
    titleLines.forEach(l => { doc.text(l, marginX + 36, ty); ty += 13; });

    if (choiceLines.length) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...COL.accent);
      choiceLines.forEach(l => { doc.text(l, marginX + 36, ty); ty += 12; });
    }

    if (detailLines.length) {
      ty += 3;
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.6); doc.setTextColor(...COL.muted);
      detailLines.forEach(l => { doc.text(l, marginX + 44, ty); ty += 11; });
    }
    doc.setTextColor(...COL.dark);
    y += h + 9;
  }

  // Box dettagliato dell'esito, con barra colorata a sinistra
  function outcomeBox(outcome) {
    const key = outcome.status === "finale" ? sevKey(outcome.severity) : "warn";
    const titleLines = wrapLines(outcome.title, maxW - 30);
    const subLines   = outcome.subtitle ? wrapLines(outcome.subtitle, maxW - 30) : [];
    const bodyLines  = outcome.body ? wrapLines(outcome.body, maxW - 30) : [];
    const commentLines = outcome.comment ? wrapLines("Commento del medico: " + outcome.comment, maxW - 30) : [];
    const noteLines  = outcome.note ? wrapLines("Nota: " + outcome.note, maxW - 30) : [];
    const warnLines  = outcome.status === "in corso"
      ? wrapLines("Percorso non ancora concluso al momento della generazione del report.", maxW - 30) : [];

    const h = 16
      + titleLines.length * 13
      + (subLines.length     ? subLines.length     * 11 + 4 : 0)
      + (bodyLines.length    ? bodyLines.length    * 12 + 4 : 0)
      + (commentLines.length ? commentLines.length * 11 + 4 : 0)
      + (noteLines.length    ? noteLines.length    * 11 + 4 : 0)
      + (warnLines.length    ? warnLines.length    * 11 + 4 : 0);
    ensureSpace(h + 12);

    doc.setFillColor(...COL[key + "Bg"]);
    doc.rect(marginX, y, 5, h, "F");
    doc.setDrawColor(...COL.border); doc.setFillColor(252, 252, 253);
    doc.roundedRect(marginX + 5, y, maxW - 5, h, 3, 3, "FD");

    let ty = y + 17;
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...COL[key]);
    titleLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 13; });
    if (subLines.length) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...COL.muted);
      subLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 11; }); ty += 3;
    }
    if (bodyLines.length) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.8); doc.setTextColor(...COL.text);
      bodyLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 12; }); ty += 3;
    }
    if (commentLines.length) {
      doc.setFont("helvetica", "italic"); doc.setFontSize(9.2); doc.setTextColor(...COL.text);
      commentLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 11; }); ty += 3;
    }
    if (noteLines.length) {
      doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(...COL.muted);
      noteLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 11; }); ty += 3;
    }
    if (warnLines.length) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...COL.warn);
      warnLines.forEach(l => { doc.text(l, marginX + 18, ty); ty += 11; });
    }
    doc.setTextColor(...COL.dark);
    y += h + 16;
  }

  /* ── COSTRUZIONE DOCUMENTO ── */
  // Titolo
  doc.setFont("helvetica", "bold"); doc.setFontSize(19); doc.setTextColor(...COL.dark);
  doc.text("PE Decision Tool", marginX, y); y += 20;
  doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...COL.muted);
  doc.text("Report di Valutazione", marginX, y);
  doc.setDrawColor(...COL.accent); doc.setLineWidth(1.6);
  doc.line(marginX, y + 10, pageW - marginX, y + 10);
  doc.setLineWidth(0.5); doc.setDrawColor(...COL.border);
  y += 28;

  statusBanner(bannerLabel, bannerKey);

  infoBox([
    ["ID Paziente",   patientId ? patientId : "Non specificato (anonimo)"],
    ["Generato il",   dateStr],
    ["Linee guida",   guidelineChoice],
    ["Strumento",     "v" + TREE_METADATA.version + " · aggiornato " + TREE_METADATA.lastUpdated]
  ]);

  sectionHeading("Percorso decisionale  (" + stepsForReport.length + " step)");
  stepsForReport.forEach((e, i) => stepCard(i + 1, e));
  y += 2;

  sectionHeading("Esito");
  if (outcome) outcomeBox(outcome);
  else {
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...COL.muted);
    doc.text("Nessun esito disponibile.", marginX, y); y += 16;
  }

  ensureSpace(48);
  doc.setDrawColor(...COL.border); doc.line(marginX, y, pageW - marginX, y); y += 14;
  doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(...COL.muted);
  wrapLines(TREE_METADATA.disclaimer, maxW).forEach(l => { doc.text(l, marginX, y); y += 10; });
  wrapLines("Fonte: " + TREE_METADATA.source, maxW).forEach(l => { doc.text(l, marginX, y); y += 10; });
  doc.setTextColor(...COL.dark);

  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COL.muted);
    doc.text("Pag. " + p + "/" + totalPages, pageW - marginX - 46, pageH - 22);
    doc.text("PE Decision Tool" + (patientId ? "  ·  " + sanitizeForPdf(patientId) : ""), marginX, pageH - 22);
  }
}

/* ═══════════════════════════════════════════════════════════════
   REPORT — VARIANTE SCHEMATICA
   Solo testo in bianco e nero, layout a elenco, nessun colore/box/
   card: pensata per la stampa rapida e la lettura "da dossier".
   ═══════════════════════════════════════════════════════════════ */
function renderSchematicPdf(doc, data) {
  const { dateStr, guidelineChoice, outcome, stepsForReport } = data;
  const marginX = 50;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxW  = pageW - marginX * 2;
  let y = 54;

  function drawRunningHeader() {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(0);
    doc.text("PE DECISION TOOL - REPORT (SCHEMATICO)" + (patientId ? " - ID: " + sanitizeForPdf(patientId) : ""), marginX, 28);
    doc.setDrawColor(0); doc.setLineWidth(0.4);
    doc.line(marginX, 33, pageW - marginX, 33);
  }
  function ensureSpace(h) {
    if (y + h > pageH - 50) { doc.addPage(); y = 50; drawRunningHeader(); }
  }
  function wrapLines(text, width) { return doc.splitTextToSize(sanitizeForPdf(text), width); }
  function line(text, opts = {}) {
    const size = opts.size || 10;
    doc.setFont("helvetica", opts.bold ? "bold" : "normal");
    doc.setFontSize(size);
    doc.setTextColor(0);
    const lines = wrapLines(text, maxW - (opts.indent || 0));
    lines.forEach(l => {
      ensureSpace(size + 3);
      doc.text(l, marginX + (opts.indent || 0), y);
      y += size + 3;
    });
  }
  function heading(text) {
    ensureSpace(20);
    y += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(0);
    doc.text(sanitizeForPdf(text).toUpperCase(), marginX, y);
    y += 4;
    doc.setDrawColor(0); doc.setLineWidth(0.6);
    doc.line(marginX, y, pageW - marginX, y);
    doc.setLineWidth(0.4);
    y += 14;
  }
  function hr() {
    ensureSpace(10);
    doc.setDrawColor(150); doc.setLineWidth(0.3);
    doc.line(marginX, y, pageW - marginX, y);
    doc.setDrawColor(0);
    y += 10;
  }

  // ── Intestazione ──
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(0);
  doc.text("PE DECISION TOOL — REPORT DI VALUTAZIONE", marginX, y); y += 14;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(80);
  doc.text("(versione schematica)", marginX, y); y += 16;
  doc.setTextColor(0);

  line("ID Paziente:  " + (patientId ? patientId : "Non specificato (anonimo)"), { bold: true });
  line("Generato il:  " + dateStr);
  line("Linee guida:  " + guidelineChoice);
  line("Strumento:    v" + TREE_METADATA.version + " (aggiornato " + TREE_METADATA.lastUpdated + ")");
  y += 4;
  hr();

  // ── Esito, in cima, in grassetto ──
  heading("Esito");
  if (outcome) {
    line(outcome.title, { bold: true, size: 11 });
    if (outcome.subtitle) line(outcome.subtitle, { size: 9.5, indent: 2 });
    if (outcome.body) line(outcome.body, { size: 10, indent: 2 });
    if (outcome.comment) line("Commento del medico: " + outcome.comment, { size: 9.5, indent: 2 });
    if (outcome.note) line("Nota: " + outcome.note, { size: 9, indent: 2 });
    if (outcome.status === "in corso") line("[ Percorso non ancora concluso al momento della generazione del report ]", { bold: true, size: 9 });
  } else {
    line("Nessun esito disponibile.");
  }
  y += 4;
  hr();

  // ── Percorso decisionale, elenco piano senza box/colori ──
  heading("Percorso decisionale (" + stepsForReport.length + " step)");
  stepsForReport.forEach((e, i) => {
    line((i + 1) + ". " + e.fromTitle, { bold: true, size: 10.5 });
    if (e.choice && e.choice !== "Continua") {
      line(e.choice, { size: 9.5, indent: 12 });
    }
    if (e.detail) {
      e.detail.split("\n").filter(Boolean).forEach(l => line("- " + l, { size: 9, indent: 18 }));
    }
    y += 5;
  });

  hr();
  line(TREE_METADATA.disclaimer, { size: 8 });
  line("Fonte: " + TREE_METADATA.source, { size: 8 });

  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(0);
    doc.text("Pag. " + p + "/" + totalPages, pageW - marginX - 42, pageH - 20);
    doc.text("PE Decision Tool" + (patientId ? " - " + sanitizeForPdf(patientId) : ""), marginX, pageH - 20);
  }
}

  wells_score:"Wells", geneva_score:"Geneva", geneva_simple_score:"Geneva Sempl.",
  perc_check:"PERC", ddimer_years:"D-Dimero+YEARS",
  diagnostic_imaging_direct:"Imaging (Alta prob.)", diagnostic_imaging:"Imaging",
  ctpa_check:"Scelta Imaging", result_very_low_prob:"PE improbabile", result_pe_excluded:"PE esclusa",
  // ESC 2019
  esc_hemodynamic_check:"Instabilità Emod.", esc_bedside_tte:"TTE Bedside",
  esc_rv_dysfunction:"Disfunzione RV", esc_search_other_causes_1:"Altre Cause",
  esc_ctpa_feasible:"Scelta Imaging",

};

function renderBreadcrumb() {
  const el = document.getElementById("breadcrumb");
  if (history.length <= 1) { el.innerHTML = ""; return; }
  el.innerHTML = history.map((id, i) => {
    const label = NODE_LABELS[id] || id;
    return i === history.length - 1
      ? `<span style="color:var(--text)">${label}</span>`
      : `<span class="crumb" onclick="jumpTo(${i})">${label}</span>`;
  }).join('<span class="crumb-sep">›</span>');
}

/* ═══════════════════════════════════════════════════════════════
   COR BADGE
   ═══════════════════════════════════════════════════════════════ */
function corBadge(cor, color) {
  if (!cor) return "";
  return `<div class="cor-badge" style="color:${color};border-color:${color}30;background:${color}12">
    <span>●</span><span>${cor}</span></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER DISPATCHER
   ═══════════════════════════════════════════════════════════════ */
function render(nodeId) {
  updateProgress();
  renderBreadcrumb();
  const node = PE_DECISION_TREE[nodeId];
  const el   = document.getElementById("content");
  el.innerHTML = "";
  const card = {
    info:       renderInfo,
    question:   renderQuestion,
    score:      renderScore,
    result:     renderResult,
    ctpa_check: renderCtpaCheck
  }[node.type]?.(node);
  if (card) el.appendChild(card);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ═══════════════════════════════════════════════════════════════
   SCORE NODE
   ═══════════════════════════════════════════════════════════════ */
function renderScore(node) {
  const nid = node.id;
  if (!scores[nid]) scores[nid] = { items:{}, total:0, interpIdx:0 };
  const state = scores[nid];
  const isPERC = node.scoreType === "perc";
  const isYEARS = node.scoreType === "years";

  // Interpretation tabs
  let tabsHtml = "";
  if (node.interpretation?.length > 1) {
    tabsHtml = `<div class="interp-tabs">` +
      node.interpretation.map((t, i) =>
        `<button class="interp-tab${i===state.interpIdx?" active":""}" onclick="setInterpIdx('${nid}',${i})">${t.label}</button>`
      ).join("") + `</div>`;
  }

  // Checklist
  const checkHtml = node.items.map(item => {
    const checked = !!state.items[item.id];
    return `
      <div class="check-item${checked?" checked":""}" onclick="toggleItem('${nid}','${item.id}',${item.points})">
        <div class="check-box">${checked?"✓":""}</div>
        <span class="check-label">${item.label}</span>
        ${isPERC ? "" : `<span class="check-pts">+${item.points}</span>`}
      </div>`;
  }).join("");

  // D-Dimer input (YEARS only) – uses onchange/oninput without full re-render
  let ddimerHtml = "";
  if (node.ddimer_input) {
    const dd  = ddimers[nid] || {};
    const age = dd.age   || "";
    const val = dd.value !== undefined ? dd.value : "";
    const ageThreshold = age >= 50 ? `Soglia age-adjusted: ${age*10} µg/L` :
                         age > 0   ? `Soglia standard: 500 µg/L` : "";
    ddimerHtml = `
      <div class="ddimer-group">
        <label class="ddimer-label">Età paziente (per soglia age-adjusted)</label>
        <div class="age-row">
          <input class="age-input" id="age-input-${nid}" type="number" min="18" max="120"
            placeholder="anni" value="${age}" oninput="updateDdimerLive('${nid}')"/>
          <span class="age-threshold" id="age-threshold-${nid}">${ageThreshold?"⟹ "+ageThreshold:""}</span>
        </div>
        <label class="ddimer-label">Valore D-Dimero</label>
        <div class="ddimer-row">
          <input class="ddimer-input" id="ddimer-val-${nid}" type="number" min="0"
            placeholder="es. 450" value="${val}" oninput="updateDdimerLive('${nid}')"/>
          <span class="ddimer-unit">ng/mL (µg/L)</span>
        </div>
        ${node.hint_age_adjusted ? `<div class="ddimer-hint">ℹ ${node.hint_age_adjusted}</div>` : ""}
        <div id="ddimer-result-${nid}"></div>
      </div>`;
  }

  // Interpretation result (non-YEARS only; YEARS handled live)
  let interpHtml = "";
  if (!isYEARS) {
    const result = getScoreResult(node, state, nid);
    if (result) {
      const sev = getSeverity(result.next);
      interpHtml = `<div class="result-banner banner-${sev}" style="margin-top:4px">
        <span>${sevIcon(sev)}</span><span>${result.category}</span></div>`;
    }
  }

  const canGo = canSubmit(node, state, nid);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    ${corBadge(node.cor, node.cor_color)}
    <span class="card-icon">${node.icon||"📋"}</span>
    <h1 class="card-title">${node.title}</h1>
    ${node.subtitle ? `<p class="card-subtitle">${node.subtitle}</p>` : ""}
    ${node.description ? `<div class="score-description">${node.description}</div>` : ""}
    ${tabsHtml}
    <div class="checklist">${checkHtml}</div>
    <div class="score-total">
      <span class="score-total-label">${isPERC?"Criteri presenti (fattori di rischio)":"Punteggio totale"}</span>
      <span class="score-total-value">${state.total}</span>
    </div>
    ${ddimerHtml}
    ${interpHtml}
    <button class="btn-primary" id="continue-btn-${nid}"
      onclick="submitScore('${nid}')" ${canGo?"":"disabled"}>
      Conferma e Continua →
    </button>
    ${history.length > 1 ? `<button class="btn-secondary" style="margin-top:10px" onclick="goBack()">← Indietro</button>` : ""}
  `;
  return card;
}

function toggleItem(nid, itemId, pts) {
  const s = scores[nid];
  if (s.items[itemId]) { delete s.items[itemId]; s.total = Math.max(0, s.total - pts); }
  else                 { s.items[itemId] = true;  s.total += pts; }
  render(history[history.length-1]);
}

function setInterpIdx(nid, idx) {
  scores[nid].interpIdx = idx;
  render(history[history.length-1]);
}

/* D-Dimer live update – updates only the result badge & age threshold, no full re-render */
function updateDdimerLive(nid) {
  const ageEl = document.getElementById("age-input-" + nid);
  const valEl = document.getElementById("ddimer-val-" + nid);
  if (!ageEl || !valEl) return;

  const age  = parseFloat(ageEl.value) || 0;
  const dval = parseFloat(valEl.value);

  if (!ddimers[nid]) ddimers[nid] = {};
  ddimers[nid].age   = age;
  ddimers[nid].value = isNaN(dval) ? undefined : dval;

  // Update age-threshold badge
  const thEl = document.getElementById("age-threshold-" + nid);
  if (thEl) {
    if      (age >= 50) thEl.textContent = "⟹ Soglia age-adjusted: " + (age*10) + " µg/L";
    else if (age >  0)  thEl.textContent = "⟹ Soglia standard: 500 µg/L";
    else                thEl.textContent = "";
  }

  // Update result preview badge
  const resEl = document.getElementById("ddimer-result-" + nid);
  const btn   = document.getElementById("continue-btn-" + nid);
  const node  = PE_DECISION_TREE[nid];
  const state = scores[nid] || { items:{}, total:0, interpIdx:0 };
  const ok    = canSubmit(node, state, nid);
  if (btn) btn.disabled = !ok;
  if (!resEl) return;

  const result = getScoreResult(node, state, nid);
  if (!result) { resEl.innerHTML = ""; return; }
  const sev = getSeverity(result.next);
  resEl.innerHTML = `<div class="result-banner banner-${sev}" style="margin-top:8px">
    <span>${sevIcon(sev)}</span><span>${result.category}</span></div>`;
}

function canSubmit(node, state, nid) {
  if (!node.ddimer_input) return true;
  const ageEl = document.getElementById("age-input-" + nid);
  const valEl = document.getElementById("ddimer-val-" + nid);
  const age  = ageEl ? parseFloat(ageEl.value) : (ddimers[nid]||{}).age;
  const dval = valEl ? parseFloat(valEl.value) : (ddimers[nid]||{}).value;
  return age > 0 && !isNaN(dval) && dval >= 0;
}

function submitScore(nid) {
  const node  = PE_DECISION_TREE[nid];
  const state = scores[nid];
  // Sync live inputs
  if (node.ddimer_input) {
    const ageEl = document.getElementById("age-input-" + nid);
    const valEl = document.getElementById("ddimer-val-" + nid);
    if (!ddimers[nid]) ddimers[nid] = {};
    if (ageEl) ddimers[nid].age   = parseFloat(ageEl.value) || 0;
    if (valEl) ddimers[nid].value = parseFloat(valEl.value);
  }
  if (!canSubmit(node, state, nid)) { alert("Inserisci età e valore D-Dimero per procedere."); return; }
  const result = getScoreResult(node, state, nid);
  if (!result) { alert("Completa la valutazione per procedere."); return; }
  goTo(result.next);
}

/* Score result calculation */
function getScoreResult(node, state, nid) {
  if (!node.interpretation) return null;
  const interp = node.interpretation[state.interpIdx];
  if (!interp) return null;

  if (node.scoreType === "years") {
    const dd  = ddimers[nid] || {};
    const dval = dd.value || 0;
    const age  = dd.age   || 0;
    const ageThreshold = age > 0 ? (age < 50 ? 500 : age * 10) : 500;
    const yearsCount = state.total;
    for (const rule of interp.rules) {
      const yOk = (rule.years === 0 && yearsCount === 0) || (rule.years === ">=1" && yearsCount >= 1);
      if (!yOk) continue;
      const threshold = rule.ddimer_val === 500 ? Math.min(500, ageThreshold) : rule.ddimer_val;
      const dOk = (rule.ddimer_op === "<"  && dval <  threshold) ||
                  (rule.ddimer_op === ">=" && dval >= threshold);
      if (dOk) return rule;
    }
    return null;
  }
  // Standard range
  for (const rule of interp.rules) {
    if (state.total >= rule.range[0] && state.total <= rule.range[1]) return rule;
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   CTPA CHECK NODE
   ═══════════════════════════════════════════════════════════════ */
function renderCtpaCheck(node) {
  const card = document.createElement("div");
  card.className = "card";
  card.id = "ctpa-card";
  card.dataset.nodeId = node.id;
  card.innerHTML = buildCtpaHtml(node);
  return card;
}

function buildCtpaHtml(node) {
  const { absolute, relative } = node.contraindications;
  const noneOpt = node.no_contraindications_option;
  const noneChecked = !!ctpaState[noneOpt.id];

  const checkedIds = Object.keys(ctpaState).filter(k => ctpaState[k] && k !== noneOpt.id);
  const hasAny = checkedIds.length > 0;

  const absItems = absolute.map(ci => {
    const on = !!ctpaState[ci.id];
    return `<div class="ci-item${on?" ci-abs":""}" onclick="toggleCi('${node.id}','${ci.id}')">
      <div class="ci-box">${on?"✓":""}</div>
      <span style="font-size:.88rem">${ci.label}</span></div>`;
  }).join("");

  const relItems = relative.map(ci => {
    const on = !!ctpaState[ci.id];
    return `<div class="ci-item${on?" ci-rel":""}" onclick="toggleCi('${node.id}','${ci.id}')">
      <div class="ci-box">${on?"✓":""}</div>
      <span style="font-size:.88rem">${ci.label}</span></div>`;
  }).join("");

  // "Nessuna controindicazione" – option separata, mutuamente esclusiva
  const noneItem = `
    <div class="ci-item ci-none${noneChecked?" ci-none-checked":""}" onclick="toggleNoneCi('${node.id}')">
      <div class="ci-box">${noneChecked?"✓":""}</div>
      <span style="font-size:.88rem;font-weight:600">${noneOpt.label}</span>
    </div>`;

  // Status banner
  let statusHtml = "";
  if (noneChecked) {
    statusHtml = `<div class="ctpa-ok">✅ Confermato: nessuna controindicazione — puoi procedere con CTPA</div>`;
  } else if (hasAny) {
    statusHtml = `<div class="result-banner banner-warning" style="margin-top:12px">
        🟡 CTPA controindicata o non disponibile – seleziona un'alternativa tra quelle proposte</div>`;
  }

  const selectedAltId = ctpaChoice[node.id] || null;

  // Card di un'alternativa di imaging: sempre cliccabile/selezionabile dall'utente.
  // "isBest" è solo un suggerimento (badge "Consigliata" in base al punteggio di
  // corrispondenza con le controindicazioni), ma è la SELEZIONE ESPLICITA
  // dell'utente (click) a determinare la scelta che compare nel report.
  const renderAltCard = (a, isBest, isSelected) => {
    const subHtml = a.subitems
      ? `<div class="alt-subitems">${a.subitems.map(s=>`<div class="alt-subitem">${s}</div>`).join("")}</div>`
      : "";
    const echoHtml = a.id.startsWith("alt_echo") ? `
      <button class="echo-toggle" onclick="event.stopPropagation(); toggleEcho(this)">▸ Parametri ecocardiografici disfunzione RV</button>
      <div class="echo-table-wrap" style="display:none">
        <table><thead><tr><th>Parametro</th><th>Tecnica</th><th>Soglia</th></tr></thead>
        <tbody>${ECHO_RV_TABLE.map(r=>`<tr>
          <td><strong>${r.parameter}</strong></td>
          <td>${r.technique}</td>
          <td>${r.definition}</td></tr>`).join("")}
        </tbody></table></div>` : "";
    const cta = isSelected
      ? `<div class="alt-cta alt-cta-selected">✓ Modalità selezionata</div>`
      : `<div class="alt-cta">Seleziona questa modalità →</div>`;
    return `<div class="alt-card${isBest?" best":""}${isSelected?" selected":""}"
        onclick="selectCtpaAlt('${node.id}','${a.id}')" style="cursor:pointer">
      <div class="alt-header">
        <span>${a.icon}</span><span>${a.label}</span>
        ${isBest?`<span class="alt-best-badge">✦ Consigliata</span>`:""}
      </div>
      <div class="alt-desc">${a.desc}</div>
      ${subHtml}${echoHtml}${cta}
    </div>`;
  };

  // Alternative proposte — per hasAny (ranked per pertinenza) o per noneChecked (CTPA)
  let altHtml = "";
  const ctpaAltId = node.alternatives.find(a => a.best_for.includes(noneOpt.id))?.id;
  if (noneChecked) {
    const ctpaAlt = node.alternatives.find(a => a.id === ctpaAltId);
    if (ctpaAlt) {
      altHtml = `<div class="alt-section-label">Modalità disponibile — seleziona per confermare</div>${renderAltCard(ctpaAlt, true, selectedAltId === ctpaAlt.id)}`;
    }
  } else if (hasAny) {
    const ranked = node.alternatives
      .filter(a => a.id !== ctpaAltId)
      .map(a => ({ ...a, score: a.best_for.filter(id => checkedIds.includes(id)).length }))
      .filter(a => a.score > 0)
      .sort((a, b) => b.score - a.score);

    if (ranked.length) {
      const topScore = ranked[0].score;
      const cards = ranked.map(a => renderAltCard(a, a.score === topScore, selectedAltId === a.id)).join("");
      altHtml = `<div class="alt-section-label">Seleziona la modalità di imaging tra le opzioni compatibili con le controindicazioni rilevate</div>${cards}`;
    }
  }

  const selectionPendingHint = (noneChecked || hasAny) && !selectedAltId
    ? `<div class="hint-box" style="margin-top:12px;border-color:var(--warn)">👆 Seleziona, tra le card sopra, la modalità di imaging che utilizzerai: comparirà poi nel report.</div>`
    : "";

  return `
    <span class="card-icon">${node.icon}</span>
    <h1 class="card-title">${node.title}</h1>
    <p class="card-subtitle">${node.subtitle}</p>
    <div class="hint-box">Seleziona le controindicazioni presenti, oppure conferma che non ce ne sono, per individuare le modalità di imaging compatibili. La valutazione si conclude a questo step: interpretazione del referto e diagnosi finale restano di competenza clinica.</div>
    <div class="ci-section-label abs">⬤ Controindicazioni Assolute</div>
    ${absItems}
    <div class="ci-section-label rel">⬤ Controindicazioni Relative</div>
    ${relItems}
    <div class="ci-section-label none">⬤ Nessuna controindicazione</div>
    ${noneItem}
    ${statusHtml}
    ${altHtml}
    ${selectionPendingHint}
    ${selectedAltId ? `
    <div class="ctpa-comment-box" style="margin-top:16px">
      <label class="ddimer-label" for="ctpa-comment-${node.id}">Commento clinico (facoltativo) — motiva la scelta della modalità di imaging</label>
      <textarea id="ctpa-comment-${node.id}" class="ctpa-comment-input" rows="3"
        placeholder="Es. paziente non trasferibile, priorità a ecografia point-of-care, disponibilità limitata di CTPA…"
        oninput="updateCtpaComment('${node.id}', this.value)">${escapeHtml(ctpaComments[node.id] || "")}</textarea>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px">
      <button class="btn-primary" style="flex:1; min-width:180px" onclick="downloadReport('visual')">📄 Report Visivo</button>
      <button class="btn-primary" style="flex:1; min-width:180px" onclick="downloadReport('schematic')">📋 Report Schematico</button>
    </div>` : ""}
    <div class="disclaimer" style="margin-top:16px">
      ${TREE_METADATA.disclaimer}<br>
      <strong>Fonte:</strong> ${TREE_METADATA.source} · ${TREE_METADATA.author}
    </div>
    <button class="btn-secondary" style="margin-top:16px" onclick="resetApp()">↺ Nuova Valutazione</button>
    <button class="btn-secondary" style="margin-top:8px" onclick="goBack()">← Indietro</button>
  `;
}

function toggleCi(nodeId, id) {
  // Selecting any contraindication clears the "nessuna" option (mutual exclusivity)
  const node = PE_DECISION_TREE[nodeId];
  const noneId = node.no_contraindications_option.id;
  ctpaState[noneId] = false;
  ctpaState[id] = !ctpaState[id];
  // Il set di alternative candidate cambia: la selezione e il commento precedenti non sono più validi
  ctpaChoice[nodeId] = null;
  ctpaComments[nodeId] = "";
  const card = document.getElementById("ctpa-card");
  if (card) card.innerHTML = buildCtpaHtml(node);
}

function toggleNoneCi(nodeId) {
  const node = PE_DECISION_TREE[nodeId];
  const noneId = node.no_contraindications_option.id;
  const turningOn = !ctpaState[noneId];
  // Selecting "nessuna" clears all other contraindication checkboxes (mutual exclusivity)
  if (turningOn) {
    Object.keys(ctpaState).forEach(k => { if (k !== noneId) ctpaState[k] = false; });
  }
  ctpaState[noneId] = turningOn;
  ctpaChoice[nodeId] = null;
  ctpaComments[nodeId] = "";
  const card = document.getElementById("ctpa-card");
  if (card) card.innerHTML = buildCtpaHtml(node);
}

// Selezione esplicita, da parte dell'utente, della modalità di imaging tra quelle
// proposte in base alle controindicazioni rilevate. È questa scelta — non un
// suggerimento automatico — a comparire poi nel report.
function selectCtpaAlt(nodeId, altId) {
  ctpaChoice[nodeId] = altId;
  const node = PE_DECISION_TREE[nodeId];
  const card = document.getElementById("ctpa-card");
  if (card) card.innerHTML = buildCtpaHtml(node);
}

// Aggiorna il commento libero associato alla scelta della modalità di imaging.
// Nessun re-render della card: evita di far perdere il focus/cursore mentre si scrive.
function updateCtpaComment(nodeId, value) {
  ctpaComments[nodeId] = value;
}

function toggleEcho(btn) {
  const wrap = btn.nextElementSibling;
  const open = wrap.style.display !== "none";
  wrap.style.display = open ? "none" : "block";
  btn.textContent = (open ? "▸" : "▾") + " Parametri ecocardiografici disfunzione RV";
}

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
function getSeverity(nextNode) {
  if (!nextNode) return "warning";
  if (nextNode === "result_very_low_prob" || nextNode === "result_pe_excluded") return "safe";
  if (nextNode === "diagnostic_imaging_direct") return "danger";
  return "warning";
}
function sevIcon(sev) {
  return { safe:"✅", warning:"🔶", danger:"🔴" }[sev] || "🔶";
}

   BOOT
   ═══════════════════════════════════════════════════════════════ */
updatePatientBadge();
updateReportButtonState();
renderPatientGate();
</script>
